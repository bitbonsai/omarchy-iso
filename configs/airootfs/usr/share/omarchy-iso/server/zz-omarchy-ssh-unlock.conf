# Omarchy Server, encrypted: boot a systemd initramfs with the SSH unlock hook
# in front of sd-encrypt, so the TPM unlocks the disk where it can and the
# owner types the passphrase over SSH where it cannot. Sorts after the
# platform's HOOKS baseline (00-omarchy-hooks.conf) and turns its busybox
# hooks into their systemd twins.
_omarchy_hooks=()
for _omarchy_hook in "${HOOKS[@]}"; do
  case $_omarchy_hook in
    udev) _omarchy_hooks+=(systemd) ;;
    keymap) _omarchy_hooks+=(sd-vconsole) ;;
    # Server has no boot splash; the prompt is on the console and over SSH.
    consolefont | plymouth | omarchy-ssh-unlock) ;;
    encrypt | sd-encrypt) _omarchy_hooks+=(omarchy-ssh-unlock sd-encrypt) ;;
    btrfs-overlayfs)
      [[ -f /usr/lib/initcpio/install/sd-btrfs-overlayfs ]] && _omarchy_hooks+=(sd-btrfs-overlayfs)
      ;;
    *) _omarchy_hooks+=("$_omarchy_hook") ;;
  esac
done
HOOKS=("${_omarchy_hooks[@]}")
unset _omarchy_hooks _omarchy_hook
